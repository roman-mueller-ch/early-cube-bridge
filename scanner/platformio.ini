[env]
platform = espressif32@6.9.0
framework = arduino
monitor_speed = 115200
lib_deps =
  h2zero/NimBLE-Arduino@2.3.0

; ESP32 DevKit (ESP-WROOM-32)
[env:esp32]
board = esp32dev

; ESP32-C3 Super Mini
[env:c3]
board = esp32-c3-devkitm-1
build_flags =
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=1
